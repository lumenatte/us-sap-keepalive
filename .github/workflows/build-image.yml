name: 自动构建并发布专属镜像

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 明确声明容器镜像仓库的写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到 GitHub 容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # 自动动态获取你的用户名
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动编译并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 关键点：将用户名强制转为纯小写，彻底绕过组织包权限拦截
          tags: ghcr.io/${{ github.repository_owner }}/us-sap-keepalive:latest
